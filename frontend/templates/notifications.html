{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>Notifications</h1>
<div class="card">
  <h2>Send test</h2>
  <form id="test-form">
    <div class="form-group">
      <label>Channel</label>
      <select id="test-channel">
        <option value="email">Email</option>
        <option value="slack">Slack</option>
        <option value="telegram">Telegram</option>
      </select>
    </div>
    <div class="form-group">
      <label>Message</label>
      <input type="text" id="test-message" value="InvestBest test notification">
    </div>
    <button type="submit" class="btn">Send test</button>
  </form>
  <p id="test-result" style="margin-top: 0.5rem;"></p>
</div>
<div class="card">
  <h2>Recent notifications</h2>
  <table>
    <thead><tr><th>Time</th><th>Channel</th><th>Subject</th><th>Status</th></tr></thead>
    <tbody id="log-tbody"><tr><td colspan="4">Loading…</td></tr></tbody>
  </table>
</div>
{% endblock %}
{% block scripts %}
<script>
fetch('/api/notifications?limit=50').then(r => r.json()).then(data => {
  const tbody = document.getElementById('log-tbody');
  if (!data.length) { tbody.innerHTML = '<tr><td colspan="4">No notifications yet</td></tr>'; return; }
  tbody.innerHTML = data.map(n => {
    const ts = n.created_at ? new Date(n.created_at).toLocaleString() : '—';
    return `<tr><td>${ts}</td><td>${n.channel}</td><td>${n.subject || '—'}</td><td>${n.status}</td></tr>`;
  }).join('');
}).catch(() => { document.getElementById('log-tbody').innerHTML = '<tr><td colspan="4">Failed to load</td></tr>'; });

document.getElementById('test-form').onsubmit = function (e) {
  e.preventDefault();
  const result = document.getElementById('test-result');
  result.textContent = 'Sending…';
  fetch('/api/notifications/send-test', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      channel: document.getElementById('test-channel').value,
      message: document.getElementById('test-message').value
    })
  }).then(r => r.json()).then(d => {
    result.textContent = d.success ? 'Sent.' : ('Error: ' + (d.error || 'Unknown'));
    result.style.color = d.success ? 'var(--accent-green)' : 'var(--accent-red)';
  }).catch(() => { result.textContent = 'Request failed'; result.style.color = 'var(--accent-red)'; });
};
</script>
{% endblock %}
