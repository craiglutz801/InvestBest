# Host port 5433 avoids clashing with a local Postgres on 5432.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: investbest
      POSTGRES_PASSWORD: investbest
      POSTGRES_DB: investbest
    ports:
      - "5433:5432"
    volumes:
      - investbest_pg:/var/lib/postgresql/data

volumes:
  investbest_pg:
