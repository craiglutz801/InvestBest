[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-research-loop"
version = "0.1.0"
description = "NorthstarAlpha Stage 6 bounded research-loop schemas, adapters, and synthetic harness (research/paper only)."
readme = "README.md"
requires-python = ">=3.10"
# No new runtime dependencies. Stage 1 northstar-diagnostics is consumed when
# installed from research/statistical_diagnostics; Stages 2–5 are discovered
# via adapters when those packages exist. pytest is a test extra only.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
chan-research-harness = "northstar_research_loop.harness:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
