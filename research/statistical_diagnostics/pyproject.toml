[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-diagnostics"
version = "0.1.0"
description = "NorthstarAlpha Stage 1 statistical diagnostics (research/eligibility evidence only)."
readme = "README.md"
requires-python = ">=3.10"
# New dependencies (Stage 1 only; not used by execution/trading code):
# - numpy: array prep, OLS, Hurst / variance-ratio / half-life estimators
# - scipy: Normal/F/chi-square tails for VR and Chow p-values; required by statsmodels
# - statsmodels: ADF, Engle-Granger/CADF, Johansen, CUSUM OLS residual breaks
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
