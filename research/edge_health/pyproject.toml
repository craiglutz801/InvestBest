[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-edge-health"
version = "0.4.0"
description = "NorthstarAlpha Stage 4 edge-health and structural-break monitoring (research/shadow only)."
readme = "README.md"
requires-python = ">=3.10"
# Core evaluator is pure Python (no scientific stack required).
# Optional Stage 1 adapter extra reuses northstar-diagnostics DiagnosticResult objects.
dependencies = []

[project.optional-dependencies]
stage1 = ["northstar-diagnostics"]
test = ["pytest>=7.4", "northstar-diagnostics"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
